version: '3.8'

services:
  db:
    image: postgres:16
    container_name: parking-db
    restart: always
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
